name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 3️⃣ Deploy to server via SSH
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "Pulling latest code..."
            cd /var/www/quote.mypswenergy.com.au
            git reset --hard
            git pull origin main

            echo "Installing backend dependencies..."
            npm install --production
            npm run build

            echo "Running database migrations..."
            # Try migrations first, fallback to push if migrations folder doesn't exist
            if [ -d "migrations" ] && [ "$(ls -A migrations 2>/dev/null)" ]; then
              echo "Running migrations from migrations folder..."
              # Install tsx if needed for migrations
              npm install tsx --save-dev 2>/dev/null || true
              npm run db:migrate || {
                echo "Migration failed, attempting push as fallback..."
                npx drizzle-kit push 2>&1 | grep -q "column \"id\" is in a primary key" && {
                  echo "⚠️  Primary key constraint error (schema already in sync) - continuing..."
                } || {
                  echo "Database push failed, but continuing deployment..."
                }
              }
            else
              echo "No migrations found, using push..."
              # The primary key error is harmless when schema is already in sync
              npx drizzle-kit push 2>&1 | grep -q "column \"id\" is in a primary key" && {
                echo "⚠️  Primary key constraint error (schema already in sync) - continuing..."
              } || {
                echo "Database push completed or failed, but continuing deployment..."
              }
            fi

            echo "Restarting backend service..."
            pm2 restart quote.mypswenergy.com.au || pm2 start dist/index.js --name "quote.mypswenergy.com.au"

            echo "saving pm2 logs..."
            pm2 save

            echo "Deployment complete!"
